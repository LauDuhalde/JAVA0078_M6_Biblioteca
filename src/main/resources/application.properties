spring.application.name=JAVA0078_M6_Biblioteca
# Puerto
server.port=8081

# Prefijo y sufijo para las vistas (para JSP)
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Nivel global
logging.level.root=info

# Nivel especifico para controladores
logging.level.org.springframework.web=debug

# Log a archivo
logging.file.name=logs/JAVA0078_M6_Biblioteca.log

# Configuracion del datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/java0078
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
